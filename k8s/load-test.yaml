apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6 7 8; do
            while true; do wget -q -O- http://notes-api/notes > /dev/null; done &
          done
          wait
